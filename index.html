<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Instituto Mecura | Medicina Canabinoide Integrativa</title>
    <meta
      name="description"
      content="A pureza da natureza, guiada pela ciência. Consulte agora mesmo sua receita e laudo médico em 5 a 45 minutos com suporte completo ANVISA RDC nº 660/2022."
    />

    <!-- Fonts: Cormorant Garamond (Luxury Editorial Serif) + Outfit (Architectural Sans) + IBM Plex Mono (Clinical Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- PWA Meta Tags (Android & iOS) -->
    <meta name="theme-color" content="#070b08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mecura" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Instituto Mecura | Medicina Canabinoide Integrativa" />
    <meta
      property="og:description"
      content="Da semente ao paciente. Consulte agora mesmo sua receita e laudo médico em 5 a 45 minutos. 100% legalizado pela ANVISA."
    />
    <meta property="og:url" content="https://mecura.sementesagrada.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instituto Mecura | Medicina Canabinoide Integrativa" />
    <meta
      name="twitter:description"
      content="A pureza da natureza, guiada pela ciência. 100% legalizado pela ANVISA (RDC nº 660/2022)."
    />

    <!-- Security -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (event.message && event.message.includes('Cannot set property fetch')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
